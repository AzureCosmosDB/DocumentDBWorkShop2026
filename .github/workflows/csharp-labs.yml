name: C# labs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Data modeling and performance
            project: 2-Data-Modeling-and-Performance/csharp/DocumentDbModeling.csproj
          - name: Search
            project: 4-Search/before/csharp/DocumentDbSearch.csproj
          - name: RAG pipeline
            project: 5-RAG-Pipeline/before/csharp/DocumentDbRag.csproj

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build "${{ matrix.project }}" --configuration Release --nologo --warnaserror
